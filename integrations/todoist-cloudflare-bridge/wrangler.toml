name = "athena-todoist-bridge"
main = "worker.js"
compatibility_date = "2026-09-29"

[[queues.producers]]
queue = "athena-todoist-jobs"
binding = "ATHENA_QUEUE"

[[queues.consumers]]
queue = "athena-todoist-jobs"
max_batch_size = 10
max_batch_timeout = 5

[[kv_namespaces]]
binding = "TODOIST_DEDUP"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
